solver: mesh  # options: subset, mesh

mesh:
  element_type: q4  # options: t3, q4, q8

# Mesh generation sizes are in image pixels.
mesh_generation:
  # options: auto, manual, structured, unstructured
  # auto: use the built-in ROI/mask generator.
  # manual: read a user-supplied mesh from nodes_file/elements_file.
  method: auto

  element_type: q4  # options: t3, q4, q8

  target_element_size: 75.0  # positive pixels; target characteristic element size

  min_element_size: 45.0  # 0 or positive pixels; lower accepted element size

  max_element_size: 110.0  # 0 or positive pixels; upper accepted element size

  fit_roi_boundary: true  # options: true, false

  remove_outside_elements: true  # options: true, false

  remove_outside_nodes: true  # options: true, false

  allow_partial_elements: false  # options: true, false

  min_element_quality: 0.1  # non-negative; larger rejects poorer elements

  max_aspect_ratio: 6.0  # positive; larger allows more elongated elements

  min_jacobian: 0.05  # positive; lower bound for accepted element Jacobian quality

optimization:
  method: fedic_element_icgn
  max_iterations: 30  # positive integer
  convergence_threshold: 1.0e-3  # positive floating point tolerance
  regularization_alpha: 0.0  # non-negative displacement-gradient regularization weight
  mirror_image_padding: true  # options: true, false; true mirror-pads images for interpolation/search near image boundaries

interpolation:
  method: bspline  # options: bspline
  degree: 5  # options: 1, 3, 5

initialization:
  method: fedic_fft

  fedic_fft:
    # FE-DIC funIntegerSearchPt uses an independent square winsize.
    window_size: 75
    search_radius: 30
    mirror_boundary_fallback: true  # use mirrored images only when the FE-DIC window crosses an image boundary

  quality_control:
    enabled: false  # options: true, false; mesh-only nodal initialization filtering/repair
    min_zncc: -1.0  # lower NCC reliability threshold; values below are treated as invalid
    max_znssd: .inf  # upper ZNSSD reliability threshold; values above are treated as invalid
    fedic_qfactor_enabled: false  # FE-DIC PCE/PPE correlation-surface quality filter
    fedic_qfactor_std_factor: 1.25  # reject q-factors below mean - factor * standard deviation
    neighbor_mad_factor: 4.0  # robust local displacement outlier cutoff
    max_neighbor_deviation: 0.0  # pixels; 0 disables absolute local deviation cap
    interpolation_neighbors: 8  # positive integer; nearest valid nodes used for repair
