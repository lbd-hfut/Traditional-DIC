workflow:
  calibrate: true
  compute_fields: false
  reconstruct: true
  # Diagnostic calibration visualization module was removed in the unified
  # workflow release; keep disabled so the pipeline does not hard-fail.
  visualize_calibration: false

solver:
  method: subset  # options: subset, mesh
  element_types: [T3, Q4, Q8]

configs:
  subset: config/subset_2d.yaml
  mesh: config/mesh_2d.yaml
  calibration: config/calibration.yaml

reconstruction:
  quality_metric: znssd  # options: znssd, correlation
  max_znssd: 2.0  # used when quality_metric is znssd; lower is stricter
  min_correlation: 0.0
  max_reprojection_error_px: 5.0
  remove_rigid_body_motion: false

strain:
  enabled: true
  method: triangular_cosserat  # currently the supported triangular surface formulation
  measure: green_lagrange  # CSV also reports Euler-Almansi invariants
  min_face_area: 0.0  # world-unit²; faces below this reference area are excluded
