name: Source regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-regression:
    name: Source regression (Linux, CPython 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: traditional-dic
          environment-file: environment.yml
          python-version: "3.11"
          auto-activate-base: false
      - name: Install source test tooling and build extension
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade build scikit-build-core pybind11 pytest
          cmake -S . -B build -DTRADITIONAL_DIC_BUILD_PYTHON=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 2
      - name: Source regression
        shell: bash -l {0}
        run: |
          PYTHONPATH=python python -m compileall python/traditional_dic qualification tests
          PYTHONPATH=python python -m pytest tests -q
          git diff --check
