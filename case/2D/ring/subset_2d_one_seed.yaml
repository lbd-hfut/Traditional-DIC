solver: subset

subset:
  radius: 15

shape_function:
  order: 1

optimization:
  method: icgn
  max_iterations: 30
  convergence_threshold: 1.0e-3

correlation:
  criterion: znssd

interpolation:
  method: bspline
  degree: 5

initialization:
  method: integer_search

  integer_search:
    subset_radius: 10
    search_radius: 30

  subpixel_refinement:
    enabled: true
    shape_function: first_order
    optimizer: icgn
    subset_radius: 15
    max_iterations: 30
    convergence_threshold: 1.0e-3

seed_selection:
  method: roi_kmeans
  seed_count: 1
  threads: 1
  quality_metric: znssd
  max_znssd: 0.2
  min_zncc: 0.7
  max_ssd: 0.05
  min_displacement_norm: 0.0
  min_texture_std: 0.02
  kmeans_iterations: 20
  kmeans_sample_limit: 20000
